# B1.6.12/B1: PostgreSQL 16 API integration and migration verification for B1.6 Step 2 modules plus B1 schema coverage
# (dedicated, disposable CI environment). Runs the ten B1.6.2–B1.6.11 PostgreSQL-backed HTTP API integration-test modules,
# the B1 storefront-hero PostgreSQL schema/migration module, and backend migration tests (disposable DB fixtures only).
# Explicitly excludes test_pg_api_fixture_smoke.py (covered by backend-phase-b16-pg-fixture-smoke.yml).
# CI-local disposable credentials only; never production databases or credentials.
name: backend-phase-b16-pg-integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # B1.6 fixture safety gates (fixed loopback-only allowlist: 127.0.0.1:5432).
      # Dedicated test URL for fixture create/drop authorization; not ordinary DATABASE_URL.
      NORTHSTAR_ALLOW_DISPOSABLE_PG_TEST_DB: "1"
      B16_TEST_DATABASE_URL: postgresql+pg8000://postgres:postgres@127.0.0.1:5432/postgres
      # CI-local disposable PostgreSQL service URL for root-conftest migration tests
      # (creates/drops only uniquely named disposable phase2_* databases; never production).
      DATABASE_URL: postgresql+pg8000://postgres:postgres@127.0.0.1:5432/postgres
      # Required test-only auth configuration (existing verified CI pattern; non-production).
      AUTH_JWT_SECRET: test-only-ci-jwt-secret-value-at-least-32-chars
      AUTH_JWT_ISSUER: https://ci.test.issuer.local
      AUTH_JWT_AUDIENCE: northstar-ci-test-audience
      AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL readiness (explicit failure)
        run: |
          ready=""
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "ERROR: PostgreSQL was not ready within 60 seconds"
            exit 1
          fi

      - name: Run B1.6 Step 2 PostgreSQL API integration and migration verification tests (serial)
        run: >-
          PYTHONPATH=. pytest -q -ra
          tests/integration_pg/test_pg_auth_api.py
          tests/integration_pg/test_pg_store_authorization_api.py
          tests/integration_pg/test_pg_store_isolation_api.py
          tests/integration_pg/test_pg_store_workspace_api.py
          tests/integration_pg/test_pg_store_categories_api.py
          tests/integration_pg/test_pg_store_products_api.py
          tests/integration_pg/test_pg_store_inventory_adjustments_api.py
          tests/integration_pg/test_pg_store_orders_api.py
          tests/integration_pg/test_pg_store_customers_api.py
          tests/integration_pg/test_pg_store_storefront_content_api.py
          tests/integration_pg/test_pg_storefront_hero_schema_b1.py
          tests/test_migrations.py
